name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker-smoke:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env
        run: |
          cp .env.example .env
          sed -i 's/^AI_PROVIDER=.*/AI_PROVIDER=mock/' .env
      - name: Levantar db, backend y frontend
        run: docker compose -f docker-compose.yml up -d --build --wait db backend frontend
      - name: Probar backend
        run: curl --fail --retry 10 --retry-connrefused http://localhost:3000/health
      - name: Probar frontend
        run: curl --fail --retry 10 --retry-connrefused http://localhost:8080/
      - name: Logs si falla
        if: failure()
        run: docker compose -f docker-compose.yml logs
      - name: Limpiar
        if: always()
        run: docker compose -f docker-compose.yml down -v
